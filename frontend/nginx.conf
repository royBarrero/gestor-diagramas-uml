server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: react-router-dom maneja rutas como /proyecto/:id/pizarra
    # en el cliente, así que refrescar en esas rutas debe seguir sirviendo index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
